[project]
name = "agent-memory-bench"
version = "0.1.0"
description = "Benchmark de políticas de memória para um agente de IA de longa duração"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "sqlite-vec>=0.1.9",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
